<style>
    body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        margin: 0;
        padding: 0;
    }
    .container {
        max-width: 600px;
        margin: 40px auto;
        background: #fff;
        padding: 30px 40px 40px 40px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h2 {
        text-align: center;
        color: #333;
    }
    form {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        justify-content: center;
    }
    input[type="text"], input[type="email"] {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 1em;
    }
    button {
        padding: 8px 16px;
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
        transition: background 0.2s;
    }
    button:hover {
        background: #1565c0;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: #fafafa;
    }
    th, td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #e0e0e0;
    }
    th {
        background: #1976d2;
        color: #fff;
    }
    tr:last-child td {
        border-bottom: none;
    }
    td button {
        background: #e53935;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 6px 12px;
        cursor: pointer;
        transition: background 0.2s;
    }
    td button:hover {
        background: #b71c1c;
    }
</style>

<div class="container">
    <h2>Lägg till användare</h2>
    <form id="addUserForm">
        <input type="text" id="name" placeholder="Namn" required>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">Lägg till</button>
    </form>

    <table id="userTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Namn</th>
                <th>Email</th>
                <th>Ta bort</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    function loadUsers() {
        fetch('/api/users')
            .then(response => response.json())
            .then(users => {
                const tbody = document.querySelector('#userTable tbody');
                tbody.innerHTML = '';
                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td><button onclick="deleteUser(${user.id})">Ta bort</button></td>
                    `;
                    tbody.appendChild(row);
                });
            });
    }

    document.getElementById('addUserForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        fetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email })
        })
        .then(response => response.json())
        .then(() => {
            loadUsers();
            document.getElementById('addUserForm').reset();
        });
    });

    function deleteUser(id) {
        fetch(`/api/users/${id}`, { method: 'DELETE' })
            .then(() => loadUsers());
    }

    // Ladda användare när sidan öppnas
    loadUsers();
</script>
